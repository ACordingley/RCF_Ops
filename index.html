        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        :root{
          --safe-area-inset-top: env(safe-area-inset-top, 0px);
          --bg: #0b1220;
          --bg2: #111d33;
          --surface: rgba(255,255,255,0.06);
          --surface-2: rgba(255,255,255,0.09);
          --border: rgba(255,255,255,0.12);
          --text: #e6eefc;
          --text-dim: #9fb0d1;
          --text-faint: #6a7da0;
          --accent: #7dd3e8;
          --accent-2: #38bdf8;
          --green: #22c55e;
          --amber: #f59e0b;
          --red: #ef4444;
          --card-radius: 14px;
          --shadow: 0 10px 30px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.08);
        }
        .app-shell.day{
          --bg: #eef3fb;
          --bg2: #d9e6f6;
          --surface: rgba(255,255,255,0.75);
          --surface-2: rgba(255,255,255,0.92);
          --border: rgba(15,23,42,0.10);
          --text: #0f172a;
          --text-dim: #475569;
          --text-faint: #94a3b8;
          --accent: #0e7490;
          --accent-2: #0369a1;
        }
        *{box-sizing:border-box}
        html,body{margin:0;padding:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}
        .app-shell{min-height:100vh;display:flex;flex-direction:column;background:
          radial-gradient(1200px 600px at 10% -10%, rgba(56,189,248,0.18), transparent 60%),
          radial-gradient(900px 500px at 90% 0%, rgba(14,165,233,0.16), transparent 55%),
          linear-gradient(180deg, var(--bg2), var(--bg));
        }
        header{
          height:60px;min-height:60px;display:flex;align-items:center;justify-content:space-between;
          padding:0 14px;gap:12px;border-bottom:1px solid var(--border);
          background: linear-gradient(180deg, var(--surface-2), var(--surface));
          backdrop-filter: blur(18px) saturate(1.2);
          position:sticky;top:var(--safe-area-inset-top);z-index:20;
        }
        .title-wrap{display:flex;flex-direction:column;line-height:1.05}
        .title-wrap{display:flex;flex-direction:column;line-height:1.05;min-width:0;flex:1}
        .title-main{font-weight:800;letter-spacing:0.04em;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
        .title-sub{font-weight:500;font-size:10px;letter-spacing:0.08em;color:var(--text-dim);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .header-center{display:flex;align-items:center;gap:8px;flex:1;justify-content:center;min-width:0;flex-wrap:wrap}
        .pill{
          display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:999px;
          background:var(--surface);border:1px solid var(--border);font-size:12px;font-weight:600;
          backdrop-filter: blur(12px);
        }
        .dot{width:8px;height:8px;border-radius:999px;background:var(--green);box-shadow:0 0 10px var(--green)}
        .clock{font-variant-numeric:tabular-nums;font-weight:700;letter-spacing:0.02em}
        .date{font-size:12px;color:var(--text-dim);font-weight:500}
        .toggle{
          border:1px solid var(--border);background:var(--surface);padding:6px 12px;border-radius:999px;
          font-size:11px;font-weight:700;letter-spacing:0.06em;cursor:pointer;transition:.2s;
        }
        .toggle:hover{transform:translateY(-1px);background:var(--surface-2)}
        .dashboard-grid{
          display:grid;gap:10px;padding:10px;flex:1;
        }
        .kpi-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;min-width:0}
        .card{
          background: linear-gradient(180deg, var(--surface-2), var(--surface));
          border:1px solid var(--border);border-radius:var(--card-radius);
          backdrop-filter: blur(18px) saturate(1.25);
          box-shadow:var(--shadow);
          display:flex;flex-direction:column;overflow:hidden;position:relative;
          min-width:0;
        }
        .card-head{
          display:flex;align-items:center;justify-content:space-between;
          padding:10px 12px 8px;border-bottom:1px solid var(--border);
          font-size:11px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--text-dim);
          gap:8px;min-width:0;flex-wrap:wrap
        }
        .card-body{padding:10px 12px;flex:1;overflow:auto}
        .kpi-value{font-size:26px;font-weight:800;letter-spacing:-0.02em;line-height:1}
        .kpi-sub{font-size:12px;color:var(--text-dim);margin-top:4px}
        .kpi-trend{font-size:11px;font-weight:700;margin-top:6px;padding:3px 7px;border-radius:999px;display:inline-flex;background:var(--surface);border:1px solid var(--border)}
        .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
        .stat{font-size:11px}
        .stat b{font-size:12px;color:var(--text)}
        .tide-canvas-wrap{position:relative;width:100%}
        canvas{display:block;width:100%}
        .tooltip{
          position:absolute;pointer-events:none;opacity:0;transition:opacity .12s;
          background: #0f172a;color:#e2e8f0;border:1px solid rgba(255,255,255,0.15);
          padding:6px 8px;border-radius:8px;font-size:12px;z-index:5;white-space:nowrap;
          box-shadow:0 8px 20px rgba(0,0,0,0.35)
        }
        .day .tooltip{background:#ffffff;color:#0f172a;border-color:rgba(0,0,0,0.1)}
        .table-wrap{overflow:auto;max-height:100%;flex:1}
        table{width:100%;border-collapse:collapse;font-size:12px}
        th{position:sticky;top:0;background:var(--surface-2);z-index:1;text-align:left;padding:6px 6px;font-size:10px;letter-spacing:0.08em;color:var(--text-dim);text-transform:uppercase;border-bottom:1px solid var(--border)}
        td{padding:6px 6px;border-bottom:1px solid var(--border);font-variant-numeric:tabular-nums}
        .badge{display:inline-flex;padding:2px 6px;border-radius:999px;font-size:10px;font-weight:700;border:1px solid var(--border)}
        .badge.H{background:rgba(14,165,233,0.15);color:#0ea5e9;border-color:rgba(14,165,233,0.3)}
        .badge.L{background:rgba(245,158,11,0.15);color:#f59e0b;border-color:rgba(245,158,11,0.3)}
        .light-row{display:flex;align-items:center;gap:10px}
        .light{
          width:18px;height:18px;border-radius:999px;border:2px solid rgba(255,255,255,0.2);position:relative;
        }
        .light.green{background:var(--green);box-shadow:0 0 14px var(--green)}
        .light.amber{background:var(--amber);box-shadow:0 0 14px var(--amber)}
        .light.red{background:var(--red);box-shadow:0 0 14px var(--red)}
        .light.dim{opacity:0.22;box-shadow:none;filter:grayscale(0.4)}
        .bar{height:8px;background:var(--surface);border:1px solid var(--border);border-radius:999px;overflow:hidden}
        .bar-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2));transition:width .6s}
        iframe{border:0;width:100%;height:100%;display:block}
        footer{
          height:28px;min-height:28px;display:flex;align-items:center;justify-content:space-between;
          padding:0 12px;font-size:11px;color:var(--text-dim);border-top:1px solid var(--border);
          background:var(--surface);backdrop-filter:blur(12px);gap:10px;white-space:nowrap;overflow:auto
        }
        footer{
          white-space:normal;flex-wrap:wrap;height:auto;min-height:28px;padding:6px 12px;overflow-x-clip
        }
        .check{display:flex;gap:12px;align-items:center}
        .check span{display:flex;align-items:center;gap:4px}
        .live{color:var(--green);font-weight:700}
        .cached{color:var(--amber);font-weight:700}
        @media (min-width:1024px){
          html,body,.app-shell{height:100vh;overflow:hidden;overflow-x-clip:max-width:100vw}
          .dashboard-grid{
            grid-template-columns:1.4fr 1fr;
            grid-template-rows:auto 1fr 1fr;
            height:calc(100vh - 60px - 28px);
            overflow:hidden;
          }
          .kpi-row{grid-column:1 / -1}
          .tide-curve{grid-column:1;grid-row:2;min-height:0}
          .windy{grid-column:2;grid-row:2;min-height:0}
          .tide-table{grid-column:1;grid-row:3;min-height:0}
          .side-stack{grid-column:2;grid-row:3;display:grid;grid-template-rows:1fr 1fr;gap:10px;min-height:0}
          .side-stack .card{min-height:0}
          .card-body{overflow:auto}
        }
        @media (max-width:1023px){
          .app-shell{height:auto;overflow:auto}
          .dashboard-grid{grid-template-columns:1fr;grid-template-rows:none;height:auto;overflow:visible}
          .kpi-row{grid-template-columns:1fr 1fr}
          .side-stack{display:grid;gap:10px}
          header{height:auto;flex-wrap:wrap;padding:10px 12px;gap:8px}
          .header-center{justify-content:flex-start;flex-wrap:wrap}
          .title-main{font-size:12px;white-space:normal}
        }
        @media (max-width:480px){
